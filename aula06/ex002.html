<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
      body  {
        background-color: #6f6fde;
        color: white;
        font: normal 24px Arial;
      }
      h1 {
        color: #fbfd5c;
      }
    </style>
</head>
<body>
   <h1>Olá mundo!</h1>
   <p>Meu primeiro parágrafo.</p> 
   <script>
        var nome = window.prompt("Qual é o seu nome?"); //vai perguntar o nome do usuário e armazenar a resposta em uma variável.
        alert("Olá " + nome + ", seja bem-vindo!"); //vai exibir uma mensagem de boas-vindas usando o nome fornecido pelo usuário.
   </script>
</body>
</html>
